brand_voice:
  use:
    - ภาษาไทยตรงไปตรงมาและอ่านเข้าใจง่าย
    - ระบุสิ่งที่ลูกค้าทำต่อได้ชัดเจน
    - เน้นงานสั่งทำ การติดตั้ง ผลงาน และคำปรึกษา
  avoid:
    - การกล่าวอ้างว่าเป็นอันดับหนึ่งโดยไม่มีหลักฐาน
    - ความเร่งด่วนหรือจำนวนคิวที่สร้างขึ้นเอง
    - ภาษากดดันหรือดูถูกลูกค้า

prohibited_claims:
  - id: PRH-001
    text: ราคาถูกที่สุด
    reason: ไม่มีหลักฐานเปรียบเทียบตลาดที่ตรวจสอบได้
  - id: PRH-002
    text: ติดตั้งเสร็จภายในหนึ่งวัน
    reason: ระยะเวลาขึ้นกับขอบเขตและหน้างาน
  - id: PRH-003
    text: เหลือคิวจำนวนจำกัด
    reason: ใช้ได้เฉพาะเมื่อมีข้อมูลกำลังการผลิตและวันหมดอายุที่ตรวจสอบได้

