  - id: retractable-awning
    name: กันสาดพับเก็บได้ระบบมือหมุนและทั่วไป
    positioning: broad_retractable_demand
    audiences:
      - เจ้าของบ้านและอาคารที่ต้องการกันสาดพับเก็บได้
    search_intents: [กันสาดพับได้, กันสาดพับเก็บได้, กันสาดมือหมุน]
